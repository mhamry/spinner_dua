<!doctype html>
<html lang="en" no="translate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <title>English Speaking Wheel Game</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      /* =========================
         GAME AREA
      ========================= */

      .game {
        width: 100%;
        margin: 20px auto;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .wheel {
        width: 500px;
        height: 500px;
        border-radius: 50%;
        margin: 20px auto;
        position: relative;
        background-color: black;
        border: 8px solid red;
      }

      .rotateWheel {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .sector {
        position: absolute;
        height: 50%;
        width: 50%;
        left: 50%;
        top: 50%;
        transform-origin: 0 0;
        transform: rotate(calc(var(--i) * 30deg));
        clip-path: polygon(0 0, 100% 50%, 96% 0);
      }

      .sector span {
        padding-left: 70px;
        padding-right: 20px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        display: flex;
        text-align: right;
      }

      /* =========================
         ARROW
      ========================= */

      .arrow {
        position: absolute;
        right: -130px;
        top: 225px;
        font-size: 55px;
        z-index: 10;
        filter: drop-shadow(2px 2px 2px black);
      }

      /* =========================
         BUTTON
      ========================= */

      .buttons {
        width: 300px;
        display: flex;
        margin: 40px auto;
        justify-content: center;
        gap: 40px;
      }

      .start,
      .stop {
        width: 110px;
        height: 45px;
        color: white;
        border: 2px solid black;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-size: 20px;
        user-select: none;
      }

      .start {
        background-color: green;
      }

      .stop {
        background-color: crimson;
      }

      .start:hover,
      .stop:hover {
        transform: scale(1.05);
      }

      .start:active,
      .stop:active {
        transform: scale(0.98);
      }

      /* =========================
         QUESTION BOX
      ========================= */

      .question-box {
        width: 500px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        /* display: none; */
      }

      .question-box h3 {
        margin-bottom: 10px;
        color: #555;
      }

      #question {
        font-size: 25px;
        font-weight: bold;
        color: #222;
        min-height: 35px;
      }

      #status {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
        min-height: 25px;
      }

      #answer {
        margin-top: 10px;
        font-size: 18px;
        color: #555;
        min-height: 25px;
      }
      #correct-answer {
        margin-top: 10px;
        font-size: 22px;
        color: #555;
        min-height: 25px;
      }

      /* =========================
         RESPONSIVE
      ========================= */

      @media (max-width: 650px) {
        body {
          overflow: hidden;
        }
        .game {
          width: 100%;
          flex-direction: column;
        }

        .wheel {
          width: 90vw;
          height: 90vw;
          max-width: 500px;
          max-height: 500px;
        }

        .question-box {
          width: 90%;
          font-size: 70%;
          height: 70%;
          margin-top: 40px;
          padding: 10px;
        }

        .question-box #question {
          font-size: 20px;
        }

        .arrow {
          right: -20px;
          font-size: 20px;
          top: 170px;
        }

        .sector span {
          font-size: 14px;
        }

        .start,
        .stop {
          width: 80px;
          height: 30px;
          font-size: 17px;
          margin-top: -20px;
          border-radius: 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="game">
      <!-- =========================
           WHEEL
      ========================= -->

      <div class="wheel">
        <div class="rotateWheel">
          <div class="sector" style="--i: 0; background: red" data-question="book">
            <span>Buku</span>
          </div>

          <div class="sector" style="--i: 1; background: khaki" data-question="pen">
            <span>Pena</span>
          </div>

          <div class="sector" style="--i: 2; background: violet" data-question="teacher">
            <span>Guru</span>
          </div>

          <div class="sector" style="--i: 3; background: greenyellow" data-question="student">
            <span>Siswa</span>
          </div>

          <div class="sector" style="--i: 4; background: green" data-question="chair">
            <span>Kursi</span>
          </div>

          <div class="sector" style="--i: 5; background: peru" data-question="table">
            <span>Meja</span>
          </div>

          <div class="sector" style="--i: 6; background: palegreen" data-question="whiteboard">
            <span>Papan tulis</span>
          </div>

          <div class="sector" style="--i: 7; background: palevioletred" data-question="bag">
            <span>Tas</span>
          </div>

          <div class="sector" style="--i: 8; background: yellow" data-question="shoes">
            <span>Sepatu</span>
          </div>

          <div class="sector" style="--i: 9; background: royalblue" data-question="friend">
            <span>Teman</span>
          </div>

          <div class="sector" style="--i: 10; background: salmon" data-question="dictionary">
            <span>Kamus</span>
          </div>

          <div class="sector" style="--i: 11; background: plum" data-question="eraser">
            <span>Penghapus papan tulis</span>
          </div>
        </div>

        <!-- ARROW -->

        <div class="arrow">⬅️</div>

        <div class="buttons">
          <div class="start">
            <i class="bi bi-play-fill"></i>
            &nbsp; Start
          </div>

          <div class="stop">
            <i class="bi bi-stop-fill"></i>
            &nbsp; Stop
          </div>
        </div>
      </div>

      <!-- =========================
           BUTTON
      ========================= -->

      <!-- =========================
           QUESTION
      ========================= -->

      <div class="question-box">
        <h3>🎯 Question</h3>
        <div id="question">Click START to play</div>
        <div id="status"></div>
        <div id="answer"></div>
        <div id="correct-answer"></div>
      </div>
    </div>

    <script>
      // ==========================================
      // ELEMENT
      // ==========================================

      const rotateWheel = document.querySelector(".rotateWheel");
      const startBtn = document.querySelector(".start");
      const stopBtn = document.querySelector(".stop");
      const questionElement = document.querySelector("#question");
      const statusElement = document.querySelector("#status");
      const answerElement = document.querySelector("#answer");
      const correctAnswerElement = document.querySelector("#correct-answer");
      const audioBenar = new Audio("audio/benar.mp3");
      const audioSalah = new Audio("audio/salah.mp3");

      // ==========================================
      // ROTATION VARIABLES
      // ==========================================

      let angle = 0;
      let speed = 0;
      const maxSpeed = 20;
      let animationFrame;
      let accelerating = false;
      let decelerating = false;
      let gameRunning = false;

      // ==========================================
      // SPEECH RECOGNITION
      // ==========================================

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = false;
      } else {
        alert("Your browser does not support Voice Recognition. Please use Google Chrome.");
      }

      // ==========================================
      // ROTATE FUNCTION
      // ==========================================

      function rotate() {
        // ACCELERATING

        if (accelerating && speed < maxSpeed) {
          speed += 0.05;
        }

        // DECELERATING

        if (decelerating && speed > 0) {
          speed -= 0.05;

          if (speed <= 0) {
            speed = 0;
            decelerating = false;

            cancelAnimationFrame(animationFrame);

            // roda sudah berhenti

            wheelStopped();

            return;
          }
        }

        angle += speed;
        rotateWheel.style.transform = `rotate(${angle}deg)`;
        animationFrame = requestAnimationFrame(rotate);
      }

      // ==========================================
      // START BUTTON
      // ==========================================

      const start = startBtn.addEventListener("click", () => {
        // Jangan mulai jika masih berputar
        if (gameRunning) {
          return;
        }

        gameRunning = true;
        accelerating = true;
        decelerating = false;
        speed = 0;

        questionElement.textContent = "The wheel is spinning...";
        statusElement.textContent = "Wait until the wheel stops.";
        answerElement.textContent = "";
        correctAnswerElement.textContent = "";

        rotate();
      });

      // // ==========================================
      // // STOP BUTTON
      // // ==========================================

      stopBtn.addEventListener("click", () => {
        if (!gameRunning) {
          return;
        }

        accelerating = false;
        decelerating = true;
      });

      // ==========================================
      // WHEN WHEEL STOPS
      // ==========================================

      function wheelStopped() {
        gameRunning = false;

        // Ambil posisi sektor yang berada
        // di depan arrow
        const selectedIndex = getSelectedSector();
        const sectors = document.querySelectorAll(".sector");
        const selectedSector = sectors[selectedIndex];

        // Ambil pertanyaan
        const question = selectedSector.querySelector("span").textContent;

        // Ambil jawaban yang benar
        const correctAnswer = selectedSector.dataset.question;

        // Tampilkan pertanyaan
        questionElement.textContent = question;
        statusElement.textContent = "🎤 Listen... Speak your answer!";
        answerElement.textContent = "";

        // Mulai Voice Recognition

        startVoiceRecognition(correctAnswer);
      }

      // ==========================================
      // MENENTUKAN SEKTOR
      // ==========================================

      function getSelectedSector() {
        // Normalisasi sudut

        let normalizedAngle = angle % 360;
        if (normalizedAngle < 0) {
          normalizedAngle += 360;
        }

        /*
          Karena arrow berada di sebelah kanan
          wheel, posisi pointer = 0 derajat.

          Setiap sektor mempunyai lebar 30 derajat.

          Kita gunakan posisi tengah sektor
          agar pemilihan lebih stabil.
        */

        let index = Math.floor(((360 - normalizedAngle + 15) % 360) / 30);
        return index;
      }

      // ==========================================
      // VOICE RECOGNITION
      // ==========================================

      function startVoiceRecognition(correctAnswer) {
        if (!recognition) {
          return;
        }

        recognition.start();
        recognition.onstart = () => {
          statusElement.textContent = "🎤 Listening...";
        };

        recognition.onresult = (event) => {
          const spokenText = event.results[0][0].transcript;
          answerElement.textContent = `You said: "${spokenText}"`;
          checkAnswer(spokenText, correctAnswer);
        };

        recognition.onerror = (event) => {
          console.log("Speech recognition error:", event.error);
          statusElement.textContent = "❌ Voice recognition error";

          if (event.error === "not-allowed") {
            alert("Microphone permission is denied. Please allow microphone access.");
          }
        };

        recognition.onend = () => {
          console.log("Voice recognition finished.");
        };
      }

      // ==========================================
      // CHECK ANSWER
      // ==========================================

      function checkAnswer(userAnswer, correctAnswer) {
        // Normalisasi

        const user = normalizeText(userAnswer);
        const correct = normalizeText(correctAnswer);

        console.log("User:", user);
        console.log("Correct:", correct);

        // ======================================
        // JAWABAN BENAR
        // ======================================

        if (user === correct || isSimilarAnswer(user, correct)) {
          statusElement.textContent = "🎉 CORRECT!";
          audioBenar.play();
          audioSalah.volume = 1;
        }

        // ======================================
        // JAWABAN SALAH
        // ======================================
        else {
          statusElement.textContent = "❌ WRONG!";
          correctAnswerElement.textContent = "Correct answer is : " + correct;
          audioSalah.play();
          audioSalah.volume = 1;
        }
      }

      // ==========================================
      // NORMALIZE TEXT
      // ==========================================

      function normalizeText(text) {
        return text
          .toLowerCase()
          .trim()
          .replace(/[.,!?]/g, "")
          .replace(/\s+/g, " ");
      }

      // ==========================================
      // SIMPLE SIMILARITY CHECK
      // ==========================================

      function isSimilarAnswer(user, correct) {
        /*
          Voice Recognition kadang-kadang
          menghasilkan sedikit perbedaan.

          Contoh:

          Correct:
          "my name is hamri"

          Recognition:
          "my name's hamri"
        */

        const userWords = user.split(" ");
        const correctWords = correct.split(" ");

        let match = 0;

        correctWords.forEach((word) => {
          if (userWords.includes(word)) {
            match++;
          }
        });

        const similarity = match / correctWords.length;

        /*
          Jika minimal 70% kata cocok,
          dianggap benar.
        */

        return similarity >= 0.7;
      }
    </script>
  </body>
</html>
